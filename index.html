    <div class="brand">홈넷 진단 도우미</div><button type="button" class="pill demo-help" data-event="demo_help" title="서버 없이 도는 데모예요. 누르면 사용법이 열려요">데모 · 사용법</button><a class="ghost" href="./" data-scenario="wifi" title="와이파이 문제 예시 (처음부터)">와이파이 예시(집 안)</a><a class="ghost" href="./?scenario=outside" data-scenario="outside" title="통신사 쪽 문제 예시 (처음부터)">통신사 예시(집 밖)</a>

<template id="demo-help" data-title="데모 사용법"><p>서버 없이 브라우저에서만 도는 데모예요. 진단 기록은 새로고침하면 지워지고, 통신사·전문가 모드 설정은 이 브라우저에 남아요.</p><ol class="kg-list"><li><b>진단 시작</b> — 홈에서 <b>문제가 있어요, 진단 시작</b>을 눌러요. 위쪽 <b>와이파이 예시(집 안)</b> / <b>통신사 예시(집 밖)</b>로 다른 경우도 볼 수 있어요.</li><li><b>통신사 흐름</b> — 통신사 예시에서 표시등 질문에 <b>꺼져 있어요</b>를 고르면 기다리기 화면으로 가요. <b>통신사 고르기</b>에서 통신사를 정하면 안내가 그 통신사에 맞게 바뀌어요.</li><li><b>일반 모드 그림</b> — 결과·조치·기다림·완료 화면의 <b>어떻게 알아냈는지 그림으로 보기</b>를 눌러요.</li><li><b>전문가 그래프</b> — 진단을 시작한 뒤 <b>설정</b>에서 <b>전문가 모드 켜기</b>를 켜요. 지식그래프 카드에서 <b>이번 경로 / 전체 보기</b>를 바꾸고, 노드를 누르면 자세한 내용이 나와요.</li></ol><p class="foot">그래프의 노드·관계는 출처를 확인하지 못한 참고 데이터예요.</p></template></body></html>
